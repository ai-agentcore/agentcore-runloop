<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">AgentCore Runloop 按需沙箱完整执行流程</title>
  <desc id="desc">展示请求准备、纯对话旁路、首次工具调用惰性创建沙箱、凭证获取、会话复用、Skill 同步、超时拒绝执行、安全错误和租约释放。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#475569"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#059669"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:28px;font-weight:700;fill:#0f172a}.sub{font-size:14px;fill:#64748b}
      .lane{font-size:14px;font-weight:700;fill:#0f172a}.node{font-size:13px;font-weight:600;fill:#0f172a}.small{font-size:11px;fill:#64748b}.label{font-size:12px;fill:#334155}
      .line{stroke:#cbd5e1;stroke-width:1.2;stroke-dasharray:5 5}.arrow{fill:none;stroke:#475569;stroke-width:1.7;marker-end:url(#arrow)}
      .blue{stroke:#2563eb;marker-end:url(#arrowBlue)}.green{stroke:#059669;marker-end:url(#arrowGreen)}.red{stroke:#dc2626}
    </style>
  </defs>
  <rect width="1440" height="1120" fill="#f8fafc"/>
  <text x="44" y="48" class="title">AgentCore Runloop · 按需沙箱完整执行流程</text>
  <text x="44" y="76" class="sub">一会话一沙箱 · 纯对话零沙箱开销 · 文件 / Shell / Skill / 附件 / 发布首次触发</text>

  <g>
    <rect x="44" y="104" width="180" height="46" rx="10" fill="#eff6ff" stroke="#60a5fa"/><text x="134" y="132" text-anchor="middle" class="lane">上游 / Agent API</text>
    <rect x="286" y="104" width="180" height="46" rx="10" fill="#eef2ff" stroke="#818cf8"/><text x="376" y="132" text-anchor="middle" class="lane">Harness / Runloop</text>
    <rect x="528" y="104" width="180" height="46" rx="10" fill="#f5f3ff" stroke="#a78bfa"/><text x="618" y="132" text-anchor="middle" class="lane">Lazy 执行后端</text>
    <rect x="770" y="104" width="180" height="46" rx="10" fill="#ecfeff" stroke="#22d3ee"/><text x="860" y="132" text-anchor="middle" class="lane">SandboxManager</text>
    <rect x="1012" y="104" width="180" height="46" rx="10" fill="#fff7ed" stroke="#fb923c"/><text x="1102" y="132" text-anchor="middle" class="lane">AgentCore 凭证</text>
    <rect x="1254" y="104" width="150" height="46" rx="10" fill="#0f172a" stroke="#334155"/><text x="1329" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Agent Sandbox</text>
  </g>
  <g>
    <line x1="134" y1="150" x2="134" y2="1050" class="line"/><line x1="376" y1="150" x2="376" y2="1050" class="line"/>
    <line x1="618" y1="150" x2="618" y2="1050" class="line"/><line x1="860" y1="150" x2="860" y2="1050" class="line"/>
    <line x1="1102" y1="150" x2="1102" y2="1050" class="line"/><line x1="1329" y1="150" x2="1329" y2="1050" class="line"/>
  </g>

  <path d="M134 186H376" class="arrow blue"/><text x="176" y="177" class="label">1. 请求：uid + conversationId + messages</text>
  <rect x="304" y="204" width="144" height="62" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="376" y="226" text-anchor="middle" class="node">请求准备</text><text x="376" y="245" text-anchor="middle" class="small">校验身份格式 · manifest</text><text x="376" y="260" text-anchor="middle" class="small">不读取 Sandbox Key</text>
  <path d="M376 290H618" class="arrow blue"/><text x="430" y="281" class="label">2. 注入 LazySandboxExecution</text>
  <rect x="546" y="306" width="144" height="58" rx="9" fill="#f5f3ff" stroke="#a78bfa"/><text x="618" y="329" text-anchor="middle" class="node">仅保存上下文</text><text x="618" y="349" text-anchor="middle" class="small">uid · 会话 · root · Skills</text>

  <polygon points="376,388 458,430 376,472 294,430" fill="#fff" stroke="#64748b"/><text x="376" y="426" text-anchor="middle" class="node">模型前必须准备？</text><text x="376" y="444" text-anchor="middle" class="small">例如附件</text>
  <path d="M294 430H214V516H376" class="arrow green"/><text x="216" y="418" class="small">否</text>
  <path d="M458 430H618" class="arrow blue"/><text x="512" y="418" class="small">是：先 acquire</text>

  <rect x="304" y="492" width="144" height="54" rx="9" fill="#ecfdf5" stroke="#34d399"/><text x="376" y="514" text-anchor="middle" class="node">启动 Agent / 模型</text><text x="376" y="534" text-anchor="middle" class="small">纯文本推理立即开始</text>
  <polygon points="376,572 458,614 376,656 294,614" fill="#fff" stroke="#64748b"/><text x="376" y="610" text-anchor="middle" class="node">是否调用沙箱能力？</text><text x="376" y="628" text-anchor="middle" class="small">文件 · Shell · Skill · 发布</text>
  <path d="M294 614H134V704H376" class="arrow green"/><text x="154" y="602" class="small">否：纯对话旁路</text>
  <rect x="304" y="680" width="144" height="54" rx="9" fill="#ecfdf5" stroke="#34d399"/><text x="376" y="702" text-anchor="middle" class="node">直接输出文本结果</text><text x="376" y="722" text-anchor="middle" class="small">无凭证 / 创建 / 健康检查开销</text>
  <path d="M458 614H618" class="arrow blue"/><text x="490" y="602" class="small">是：首次工具触发</text>

  <path d="M618 430V402H860" class="arrow blue"/><path d="M618 614V402H860" class="arrow blue"/><text x="680" y="392" class="label">3. workspace() / acquire()</text>
  <rect x="788" y="422" width="144" height="62" rx="9" fill="#ecfeff" stroke="#22d3ee"/><text x="860" y="445" text-anchor="middle" class="node">会话绑定查找</text><text x="860" y="464" text-anchor="middle" class="small">同请求共享创建 Promise</text><text x="860" y="479" text-anchor="middle" class="small">同会话互斥租约</text>
  <polygon points="860,510 936,548 860,586 784,548" fill="#fff" stroke="#64748b"/><text x="860" y="545" text-anchor="middle" class="node">已有健康绑定？</text>
  <path d="M936 548H1012" class="arrow blue"/><text x="958" y="536" class="small">否</text>
  <path d="M860 586V676H1138" class="arrow green"/><text x="878" y="617" class="small">是：快速复用</text><text x="878" y="636" class="small">60 秒窗口内不重复健康检查</text><text x="878" y="653" class="small">接近 TTL 半程才续期</text>

  <path d="M1012 548H1102" class="arrow blue"/><text x="1018" y="536" class="label">4. resolve apiKey</text>
  <rect x="1030" y="566" width="144" height="62" rx="9" fill="#fff7ed" stroke="#fb923c"/><text x="1102" y="589" text-anchor="middle" class="node">Sandbox Key</text><text x="1102" y="608" text-anchor="middle" class="small">部署 Secret 直注优先</text><text x="1102" y="623" text-anchor="middle" class="small">否则 credentials.get()</text>
  <path d="M1174 598H1329" class="arrow blue"/><text x="1200" y="586" class="label">5. Sandbox.create()</text>
  <path d="M1329 640H860" class="arrow green"/><text x="1040" y="631" class="small">sandboxId + SDK 文件 / 命令客户端</text>
  <rect x="788" y="660" width="144" height="72" rx="9" fill="#ecfdf5" stroke="#34d399"/><text x="860" y="683" text-anchor="middle" class="node">准备执行根</text><text x="860" y="702" text-anchor="middle" class="small">ensure root · 保存绑定</text><text x="860" y="718" text-anchor="middle" class="small">Skill 变化时批量导入</text>
  <path d="M932 696H1329" class="arrow blue"/><text x="1044" y="686" class="label">6. 文件 / Shell 在沙箱执行</text>
  <path d="M1329 752H618" class="arrow green"/><text x="906" y="743" class="small">结构化工具结果 · cwd 限制在 AGENTCORE_SANDBOX_ROOT</text>
  <path d="M618 752H376V780" class="arrow green"/><text x="438" y="771" class="small">模型继续推理 / 后续工具复用</text>

  <rect x="60" y="814" width="1320" height="170" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="84" y="843" class="node">异常处理分支</text>
  <g>
    <rect x="84" y="864" width="370" height="92" rx="10" fill="#fff7ed" stroke="#fb923c"/><text x="102" y="889" class="node">SDK 请求超时</text><text x="102" y="912" class="label">返回 SANDBOX_NOT_READY；不切换后端</text><text x="102" y="932" class="small">文件、Skill、附件和发布始终使用远端执行根</text>
    <rect x="535" y="864" width="370" height="92" rx="10" fill="#fef2f2" stroke="#fca5a5"/><text x="553" y="889" class="node">凭证 / 权限 / 模板 / 配额错误</text><text x="553" y="912" class="label">不回退本地 → 工具返回 SANDBOX_NOT_READY</text><text x="553" y="932" class="small">只保留 stage、causeType/code/status/requestId；模型仍可文本回复</text>
    <rect x="986" y="864" width="370" height="92" rx="10" fill="#eef2ff" stroke="#818cf8"/><text x="1004" y="889" class="node">附件等模型前置操作失败</text><text x="1004" y="912" class="label">无法安全启动 Agent → HTTP 503 / AG-UI RUN_ERROR</text><text x="1004" y="932" class="small">错误正文、stack、Key、Token 均不进入响应或日志</text>
  </g>

  <path d="M376 780V1014H860" class="arrow"/><text x="524" y="1005" class="label">7. finally：释放当前请求租约</text>
  <rect x="788" y="994" width="144" height="54" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="860" y="1016" text-anchor="middle" class="node">lease → idle</text><text x="860" y="1036" text-anchor="middle" class="small">保留会话绑定，不销毁沙箱</text>
  <text x="44" y="1090" class="sub">结果：普通问答不受沙箱控制面影响；真正需要执行能力时才付创建成本；同一会话后续轮次复用已有沙箱。</text>
</svg>
