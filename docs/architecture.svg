<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1000" viewBox="0 0 1180 1000" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b45309"/>
    </marker>
    <style>
      .layer-title { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .box-title   { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .box-sub     { font-size: 11px; fill: #475569; }
      .tag         { font-size: 11px; font-weight: 700; fill: #334155; }
      .flow        { font-size: 11px; fill: #334155; }
      .edge        { stroke: #475569; stroke-width: 1.6; fill: none; }
      .edgeLoop    { stroke: #b45309; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
      .caption     { font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="1000" fill="#f8fafc"/>
  <text x="40" y="42" font-size="24" font-weight="800" fill="#0f172a">AgentCore Runloop 架构</text>
  <text x="40" y="66" class="caption">单 Node 进程 · Codex 为执行引擎 · 复用 AgentCore 模型 / MCP / Skill</text>

  <!-- ============ 外部调用方 ============ -->
  <rect x="40" y="88" width="1100" height="70" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="60" y="112" class="layer-title">外部调用方</text>
  <g>
    <rect x="60" y="120" width="230" height="26" rx="6" fill="#fff" stroke="#c7d2fe"/>
    <text x="72" y="138" class="box-sub">AgentCore 网关 / API Caller</text>
    <rect x="305" y="120" width="230" height="26" rx="6" fill="#fff" stroke="#c7d2fe"/>
    <text x="317" y="138" class="box-sub">Chat 服务 (附件 / STS)</text>
    <rect x="550" y="120" width="290" height="26" rx="6" fill="#fff" stroke="#c7d2fe"/>
    <text x="562" y="138" class="box-sub">POST /ag-ui/agent · /invocations · /v1/run · /v1/sts</text>
  </g>

  <!-- arrow ext -> harness -->
  <path class="edge" d="M590,158 L590,190" marker-end="url(#arrow)"/>

  <!-- ============ Harness 层 ============ -->
  <rect x="40" y="192" width="1100" height="286" rx="12" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="60" y="216" class="layer-title">src/  —  Node Hono Harness  (:8080, 单进程)</text>

  <!-- row 1 -->
  <g>
    <rect x="60" y="228" width="200" height="60" rx="8" fill="#fff" stroke="#67e8f9"/>
    <text x="72" y="248" class="box-title">main.ts</text>
    <text x="72" y="266" class="box-sub">进程与生命周期</text>
    <text x="72" y="280" class="box-sub">/healthz · /readyz</text>

    <rect x="272" y="228" width="230" height="60" rx="8" fill="#fff" stroke="#67e8f9"/>
    <text x="284" y="248" class="box-title">app.ts</text>
    <text x="284" y="266" class="box-sub">路由 + 组装 RunRequest</text>
    <text x="284" y="280" class="box-sub">SSE 流式返回</text>

    <rect x="514" y="228" width="200" height="60" rx="8" fill="#fff" stroke="#67e8f9"/>
    <text x="526" y="248" class="box-title">config.ts</text>
    <text x="526" y="266" class="box-sub">环境变量</text>
    <text x="526" y="280" class="box-sub">解析与校验</text>

    <rect x="726" y="228" width="200" height="60" rx="8" fill="#fff" stroke="#67e8f9"/>
    <text x="738" y="248" class="box-title">runtime.ts</text>
    <text x="738" y="266" class="box-sub">AgentCore Node SDK</text>
    <text x="738" y="280" class="box-sub">Model/MCP/Skill/凭证</text>

    <rect x="938" y="228" width="184" height="60" rx="8" fill="#fff" stroke="#67e8f9"/>
    <text x="950" y="248" class="box-title">agentloop.ts</text>
    <text x="950" y="266" class="box-sub">OTLP 观测上报</text>
    <text x="950" y="280" class="box-sub">fail-open</text>
  </g>

  <!-- row 2 : loopback -->
  <rect x="60" y="300" width="536" height="76" rx="8" fill="#fef9c3" stroke="#fde047"/>
  <text x="72" y="320" class="box-title">internal-api.ts  —  同进程 loopback (仅供 Codex)</text>
  <g>
    <rect x="72" y="330" width="240" height="34" rx="6" fill="#fff" stroke="#facc15"/>
    <text x="84" y="346" class="tag">/model/v1</text>
    <text x="84" y="359" class="box-sub">OpenAI 兼容模型 HTTP</text>
    <rect x="324" y="330" width="260" height="34" rx="6" fill="#fff" stroke="#facc15"/>
    <text x="336" y="346" class="tag">/mcp</text>
    <text x="336" y="359" class="box-sub">MCP HTTP · 随机内部 Token 鉴权</text>
  </g>

  <!-- row 2 right: supporting modules -->
  <g>
    <rect x="608" y="300" width="160" height="36" rx="8" fill="#fff" stroke="#67e8f9"/>
    <text x="620" y="316" class="box-title">ag-ui.ts</text>
    <text x="620" y="330" class="box-sub">AG-UI ⇄ 事件转换</text>

    <rect x="780" y="300" width="160" height="36" rx="8" fill="#fff" stroke="#67e8f9"/>
    <text x="792" y="316" class="box-title">attachments.ts</text>
    <text x="792" y="330" class="box-sub">OSS 附件 → uploads/</text>

    <rect x="952" y="300" width="170" height="36" rx="8" fill="#fff" stroke="#67e8f9"/>
    <text x="964" y="316" class="box-title">artifacts.ts</text>
    <text x="964" y="330" class="box-sub">publish_artifact → OSS</text>

    <rect x="608" y="342" width="256" height="34" rx="8" fill="#fff" stroke="#67e8f9"/>
    <text x="620" y="358" class="box-title">workspace.ts / session-workspace.ts</text>
    <text x="620" y="371" class="box-sub">Skill 投影 + 会话工作目录安全创建</text>

    <rect x="876" y="342" width="246" height="34" rx="8" fill="#fff" stroke="#67e8f9"/>
    <text x="888" y="358" class="box-title">sts-broker.ts</text>
    <text x="888" y="371" class="box-sub">/v1/sts 身份交换 (WAT → AssumeRole)</text>
  </g>

  <!-- note under harness -->
  <rect x="60" y="388" width="1062" height="76" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="72" y="408" class="box-title">RunRequest 组装 (app.ts)</text>
  <text x="72" y="426" class="box-sub">model → 指向 loopback /model/v1     ·     resources → 单个 MCP 资源指向 loopback /mcp</text>
  <text x="72" y="442" class="box-sub">features = { toolBridge: "mcp", execViaMcp: true }     ·     agent = { cli: codex, systemPrompt, cwd }</text>
  <text x="72" y="458" class="caption">本部署不传 Sandbox → 远程沙箱链路未启用（依赖仍在编译范围内）</text>

  <!-- arrow harness -> kernel -->
  <path class="edge" d="M590,478 L590,510" marker-end="url(#arrow)"/>
  <text x="600" y="498" class="flow">LoopRunner.run(request)</text>

  <!-- ============ Runloop 内核 ============ -->
  <rect x="40" y="512" width="1100" height="308" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="60" y="536" class="layer-title">vendor/runloop/  —  Runloop + Codex 执行内核</text>

  <!-- runner -->
  <rect x="60" y="548" width="330" height="72" rx="8" fill="#fff" stroke="#c4b5fd"/>
  <text x="72" y="568" class="box-title">loop/runner.ts  编排</text>
  <text x="72" y="586" class="box-sub">起 SidecarServer + agentrun-mcp server</text>
  <text x="72" y="600" class="box-sub">构建系统提示词 · 拉起 Codex</text>
  <text x="72" y="614" class="box-sub">loop/run.ts 单会话状态机</text>

  <!-- mcp aggregator -->
  <rect x="404" y="548" width="330" height="72" rx="8" fill="#fff" stroke="#c4b5fd"/>
  <text x="416" y="568" class="box-title">mcp/  agentrun-mcp 聚合器</text>
  <text x="416" y="586" class="box-sub">Codex 只连它；下游 MCP / openapi /</text>
  <text x="416" y="600" class="box-sub">子 agent / 沙箱全部聚合其后</text>
  <text x="416" y="614" class="box-sub">tools/list 静态清单 → 懒连校正</text>

  <!-- acp -->
  <rect x="748" y="548" width="374" height="72" rx="8" fill="#fff" stroke="#c4b5fd"/>
  <text x="760" y="568" class="box-title">acp/ + provider/proxy.ts</text>
  <text x="760" y="586" class="box-sub">Codex ⇄ Runloop 事件适配 (stdio/ACP)</text>
  <text x="760" y="600" class="box-sub">模型请求代理 · 事件归一化</text>
  <text x="760" y="614" class="box-sub">events/ · hitl/ · resources/</text>

  <!-- sidecar big box -->
  <rect x="60" y="636" width="1062" height="168" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="72" y="658" class="box-title">sidecar/  —  工具执行与治理层  (127.0.0.1 随机端口, 同生命周期)</text>

  <rect x="72" y="668" width="330" height="60" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="84" y="686" class="box-title">SidecarServer.gatedExecute()</text>
  <text x="84" y="702" class="box-sub">唯一带闸门的执行入口</text>
  <text x="84" y="716" class="box-sub">MCP 与 shell 隧道共用同一道闸</text>

  <rect x="414" y="668" width="330" height="60" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="426" y="686" class="box-title">maybeSuspend()  HITL 三层判定</text>
  <text x="426" y="702" class="box-sub">ask 原语 → 静态规则 → LLM judge</text>
  <text x="426" y="716" class="box-sub">命中 → suspend 事件 + onSuspend 中断</text>

  <rect x="756" y="668" width="354" height="60" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="768" y="686" class="box-title">执行后端选择</text>
  <text x="768" y="702" class="box-sub">本地 workspace  ·  或 RemoteSandboxBackend</text>
  <text x="768" y="716" class="box-sub">forwardNestedResolution 子 agent 委派</text>

  <rect x="72" y="738" width="1038" height="54" rx="8" fill="#fff" stroke="#fdba74"/>
  <text x="84" y="756" class="box-sub" font-weight="700" fill="#9a3412">工具实现：</text>
  <text x="84" y="776" class="box-sub">shell-exec · file-tools · image-tools · skill-tools · web-caller · openapi-caller · mcp-proxy · ssrf</text>
  <text x="640" y="756" class="box-sub" font-weight="700" fill="#9a3412">远程沙箱链路 (当前未启用)：</text>
  <text x="640" y="776" class="box-sub">agentrun-client (@alicloud/agentrun20250910) · sandbox-provisioner · exec-backend · remote-sandbox</text>

  <!-- arrow kernel -> codex -->
  <path class="edge" d="M590,820 L590,856" marker-end="url(#arrow)"/>
  <text x="600" y="842" class="flow">stdio / ACP</text>

  <!-- ============ Codex ============ -->
  <rect x="330" y="858" width="520" height="60" rx="10" fill="#0f172a" stroke="#0f172a"/>
  <text x="590" y="884" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">Codex CLI  —  Agent 执行引擎</text>
  <text x="590" y="904" font-size="11" fill="#cbd5e1" text-anchor="middle">回连同进程 /model/v1 (调模型) 与 /mcp (调工具)</text>

  <!-- loopback arrows from Codex back up to internal-api -->
  <path class="edgeLoop" d="M330,888 L20,888 L20,338 L60,338" marker-end="url(#arrowLoop)"/>
  <text x="26" y="620" class="flow" fill="#b45309" transform="rotate(-90 26,620)">loopback: 模型 / 工具调用 (内部 Token)</text>

  <!-- event flow back -->
  <path class="edge" d="M850,888 L1160,888 L1160,258 L1122,258" marker-end="url(#arrow)" stroke-dasharray="2 3"/>
  <text x="1150" y="560" class="flow" transform="rotate(-90 1150,560)">事件 → SSE 流回外部</text>

  <!-- legend -->
  <g>
    <rect x="40" y="940" width="1100" height="46" rx="8" fill="#fff" stroke="#e2e8f0"/>
    <line x1="60" y1="956" x2="100" y2="956" class="edge"/>
    <text x="108" y="960" class="caption">主调用 / 数据流</text>
    <line x1="240" y1="956" x2="280" y2="956" class="edgeLoop"/>
    <text x="288" y="960" class="caption">Codex loopback 回连 (/model/v1 · /mcp)</text>
    <line x1="560" y1="956" x2="600" y2="956" class="edge" stroke-dasharray="2 3"/>
    <text x="608" y="960" class="caption">事件 → SSE 返回</text>
    <rect x="740" y="948" width="16" height="16" rx="3" fill="#fef9c3" stroke="#facc15"/>
    <text x="764" y="960" class="caption">loopback 内部接口</text>
    <rect x="900" y="948" width="16" height="16" rx="3" fill="#fff7ed" stroke="#fdba74"/>
    <text x="924" y="960" class="caption">sidecar 工具执行层</text>
  </g>
</svg>
