<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent Sandbox 使用案例</title><desc id="desc">六个典型使用案例及其输入、沙箱动作、输出和隔离收益。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.h{font-size:28px;font-weight:800;fill:#0f172a}.sub{font-size:14px;fill:#64748b}.num{font-size:13px;font-weight:800;fill:#fff}.t{font-size:17px;font-weight:780;fill:#0f172a}.label{font-size:11px;font-weight:750;fill:#2563eb}.b{font-size:12px;fill:#475569}.s{font-size:11px;fill:#64748b}</style><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".09"/></filter></defs>
  <rect width="1280" height="900" fill="#f8fafc"/><text x="44" y="48" class="h">Agent Sandbox 使用案例</text><text x="44" y="75" class="sub">共同模型：请求 UID → 一会话一沙箱 → 文件与 Shell 远程执行 → 受控交付</text>

  <g transform="translate(44 108)"><rect width="376" height="224" rx="18" fill="#fff" stroke="#bfdbfe" filter="url(#sh)"/><circle cx="34" cy="34" r="18" fill="#2563eb"/><text x="34" y="39" text-anchor="middle" class="num">01</text><text x="64" y="40" class="t">代码生成与验证</text><text x="24" y="76" class="label">输入</text><text x="78" y="76" class="b">需求、代码仓库、依赖说明</text><text x="24" y="105" class="label">沙箱</text><text x="78" y="105" class="b">生成代码 → 安装依赖 → build/test</text><text x="24" y="134" class="label">输出</text><text x="78" y="134" class="b">补丁、构建物、测试报告</text><rect x="24" y="160" width="328" height="42" rx="9" fill="#eff6ff"/><text x="38" y="179" class="s">价值：不可信代码不接触 Harness 文件系统</text><text x="38" y="195" class="s">会话间代码与进程完全隔离</text></g>
  <g transform="translate(452 108)"><rect width="376" height="224" rx="18" fill="#fff" stroke="#a7f3d0" filter="url(#sh)"/><circle cx="34" cy="34" r="18" fill="#059669"/><text x="34" y="39" text-anchor="middle" class="num">02</text><text x="64" y="40" class="t">数据分析与脚本执行</text><text x="24" y="76" class="label" fill="#059669">输入</text><text x="78" y="76" class="b">CSV、JSON、图片、分析指令</text><text x="24" y="105" class="label" fill="#059669">沙箱</text><text x="78" y="105" class="b">Python/Node 清洗、计算、绘图</text><text x="24" y="134" class="label" fill="#059669">输出</text><text x="78" y="134" class="b">结果文件、图表、摘要</text><rect x="24" y="160" width="328" height="42" rx="9" fill="#ecfdf5"/><text x="38" y="179" class="s">价值：上传文件只落当前会话 uploads/</text><text x="38" y="195" class="s">资源消耗和失败被限制在沙箱内</text></g>
  <g transform="translate(860 108)"><rect width="376" height="224" rx="18" fill="#fff" stroke="#fed7aa" filter="url(#sh)"/><circle cx="34" cy="34" r="18" fill="#ea580c"/><text x="34" y="39" text-anchor="middle" class="num">03</text><text x="64" y="40" class="t">仓库检查与自动修复</text><text x="24" y="76" class="label" fill="#ea580c">输入</text><text x="78" y="76" class="b">Git 仓库、规则、失败日志</text><text x="24" y="105" class="label" fill="#ea580c">沙箱</text><text x="78" y="105" class="b">clone → scan → edit → regression</text><text x="24" y="134" class="label" fill="#ea580c">输出</text><text x="78" y="134" class="b">修复代码、diff、验证证据</text><rect x="24" y="160" width="328" height="42" rx="9" fill="#fff7ed"/><text x="38" y="179" class="s">价值：Git 凭证与工作副本按会话隔离</text><text x="38" y="195" class="s">失败修改不会污染运行时仓库</text></g>

  <g transform="translate(44 364)"><rect width="376" height="224" rx="18" fill="#fff" stroke="#c4b5fd" filter="url(#sh)"/><circle cx="34" cy="34" r="18" fill="#7c3aed"/><text x="34" y="39" text-anchor="middle" class="num">04</text><text x="64" y="40" class="t">托管 Skill 驱动任务</text><text x="24" y="76" class="label" fill="#7c3aed">输入</text><text x="78" y="76" class="b">AgentCore Skill 名称与版本</text><text x="24" y="105" class="label" fill="#7c3aed">沙箱</text><text x="78" y="105" class="b">批量导入 .agents/skills 后执行脚本</text><text x="24" y="134" class="label" fill="#7c3aed">输出</text><text x="78" y="134" class="b">标准化报告、文档或工程文件</text><rect x="24" y="160" width="328" height="42" rx="9" fill="#f5f3ff"/><text x="38" y="179" class="s">价值：Skill 内容与业务 cwd 分离</text><text x="38" y="195" class="s">版本固定，依赖源由 SDK 持久根管理</text></g>
  <g transform="translate(452 364)"><rect width="376" height="224" rx="18" fill="#fff" stroke="#67e8f9" filter="url(#sh)"/><circle cx="34" cy="34" r="18" fill="#0891b2"/><text x="34" y="39" text-anchor="middle" class="num">05</text><text x="64" y="40" class="t">并发多会话工作区</text><text x="24" y="76" class="label" fill="#0891b2">输入</text><text x="78" y="76" class="b">同一用户的多个 conversation</text><text x="24" y="105" class="label" fill="#0891b2">沙箱</text><text x="78" y="105" class="b">每会话独立 sandboxId 与 cwd</text><text x="24" y="134" class="label" fill="#0891b2">行为</text><text x="78" y="134" class="b">跨会话并行；同会话串行</text><rect x="24" y="160" width="328" height="42" rx="9" fill="#ecfeff"/><text x="38" y="179" class="s">价值：提高吞吐，同时避免文件竞争</text><text x="38" y="195" class="s">忙碌会话明确返回 409，不抢占</text></g>
  <g transform="translate(860 364)"><rect width="376" height="224" rx="18" fill="#fff" stroke="#86efac" filter="url(#sh)"/><circle cx="34" cy="34" r="18" fill="#16a34a"/><text x="34" y="39" text-anchor="middle" class="num">06</text><text x="64" y="40" class="t">长期项目与 NAS 工作根</text><text x="24" y="76" class="label" fill="#16a34a">输入</text><text x="78" y="76" class="b">跨多次沙箱生命周期的项目</text><text x="24" y="105" class="label" fill="#16a34a">沙箱</text><text x="78" y="105" class="b">挂载租户/会话专属 NAS 子目录</text><text x="24" y="134" class="label" fill="#16a34a">输出</text><text x="78" y="134" class="b">持续代码状态 + OSS 最终交付物</text><rect x="24" y="160" width="328" height="42" rx="9" fill="#f0fdf4"/><text x="38" y="179" class="s">价值：计算生命周期与数据生命周期解耦</text><text x="38" y="195" class="s">NAS 工作根与 OSS 交付根职责分离</text></g>

  <rect x="44" y="624" width="1192" height="210" rx="18" fill="#0f172a"/>
  <text x="68" y="656" font-size="16" font-weight="780" fill="#fff">所有案例共用的安全不变量</text>
  <g fill="#1e293b" stroke="#475569"><rect x="68" y="680" width="210" height="118" rx="12"/><rect x="298" y="680" width="210" height="118" rx="12"/><rect x="528" y="680" width="210" height="118" rx="12"/><rect x="758" y="680" width="210" height="118" rx="12"/><rect x="988" y="680" width="224" height="118" rx="12"/></g>
  <g font-size="13" font-weight="700" fill="#e2e8f0"><text x="86" y="708">身份上下文</text><text x="316" y="708">动态凭证</text><text x="546" y="708">路径约束</text><text x="776" y="708">失败隔离</text><text x="1006" y="708">受控交付</text></g>
  <g font-size="11" fill="#94a3b8"><text x="86" y="733">uid 来自请求 Body</text><text x="86" y="752">接入方负责鉴权校验</text><text x="86" y="771">工具不可覆盖</text><text x="316" y="733">Harness 按资源名取 Key</text><text x="316" y="752">不写环境与日志</text><text x="316" y="771">失败不泄露正文</text><text x="546" y="733">cwd 限制在会话根</text><text x="546" y="752">拒绝穿越与链接</text><text x="546" y="771">附件先验证再物化</text><text x="776" y="733">获取超时可本地回退</text><text x="776" y="752">同会话并发拒绝</text><text x="776" y="771">默认关闭公网</text><text x="1006" y="733">只读常规文件字节</text><text x="1006" y="752">OSS 不覆盖发布</text><text x="1006" y="771">仅返回 /f/&lt;id&gt;</text></g>
  <text x="44" y="872" class="s">选型建议：短任务使用沙箱本地根；跨生命周期项目使用 NAS；所有用户可见最终文件统一发布到 OSS Artifact Root。</text>
</svg>
