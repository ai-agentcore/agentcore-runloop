<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">单会话 Agent Sandbox 生命周期</title><desc id="desc">从请求鉴权、租约获取、沙箱创建、资源准备、Agent 执行到释放租约的完整时序。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#475569"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.h{font-size:27px;font-weight:800;fill:#0f172a}.s{font-size:14px;fill:#64748b}.actor{font-size:14px;font-weight:750;fill:#0f172a}.n{font-size:12px;fill:#334155}.sm{font-size:11px;fill:#64748b}.line{stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:5 5}.arr{stroke:#475569;stroke-width:1.7;fill:none;marker-end:url(#a)}.blue{stroke:#2563eb}.green{stroke:#059669}.red{stroke:#dc2626}</style></defs>
  <rect width="1280" height="820" fill="#f8fafc"/><text x="44" y="48" class="h">单会话沙箱生命周期</text><text x="44" y="74" class="s">绑定键 uid + conversationId · 同会话串行 · 不同会话并行</text>
  <g><rect x="55" y="105" width="150" height="44" rx="10" fill="#eff6ff" stroke="#60a5fa"/><text x="130" y="132" text-anchor="middle" class="actor">上游网关</text><rect x="286" y="105" width="150" height="44" rx="10" fill="#eef2ff" stroke="#818cf8"/><text x="361" y="132" text-anchor="middle" class="actor">Harness</text><rect x="517" y="105" width="150" height="44" rx="10" fill="#ecfeff" stroke="#22d3ee"/><text x="592" y="132" text-anchor="middle" class="actor">SandboxManager</text><rect x="748" y="105" width="150" height="44" rx="10" fill="#ecfdf5" stroke="#34d399"/><text x="823" y="132" text-anchor="middle" class="actor">AgentCore Runtime</text><rect x="979" y="105" width="180" height="44" rx="10" fill="#0f172a" stroke="#334155"/><text x="1069" y="132" text-anchor="middle" font-size="14" font-weight="750" fill="#fff">Agent Sandbox</text></g>
  <g><line x1="130" y1="149" x2="130" y2="770" class="line"/><line x1="361" y1="149" x2="361" y2="770" class="line"/><line x1="592" y1="149" x2="592" y2="770" class="line"/><line x1="823" y1="149" x2="823" y2="770" class="line"/><line x1="1069" y1="149" x2="1069" y2="770" class="line"/></g>
  <path d="M130 182H361" class="arr blue"/><text x="176" y="173" class="n">1. 请求 Body uid + conversationId</text>
  <rect x="300" y="199" width="122" height="50" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="312" y="219" class="n">2. 校验格式</text><text x="312" y="238" class="sm">缺 uid → default</text>
  <path d="M361 272H592" class="arr blue"/><text x="397" y="263" class="n">3. 注入 LazySandboxExecution（不创建）</text>
  <rect x="531" y="290" width="122" height="62" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="543" y="310" class="n">4. Agent 开始</text><text x="543" y="329" class="sm">纯对话 → 跳过</text><text x="543" y="345" class="sm">工具 → acquire</text>
  <path d="M592 376H1069" class="arr"/><text x="690" y="367" class="n">5a. 已绑定：短期快速复用</text>
  <path d="M1069 402H592" class="arr green"/><text x="761" y="393" class="sm">健康：复用同一 sandboxId</text>
  <path d="M592 438H823" class="arr blue"/><text x="632" y="429" class="n">5b. 未绑定：credential(name)</text>
  <path d="M823 464H592" class="arr green"/><text x="643" y="455" class="sm">真实 Key（仅当前 SDK 调用内存）</text>
  <path d="M592 500H1069" class="arr blue"/><text x="674" y="491" class="n">6. Sandbox.create(template, endpoint, metadata)</text>
  <path d="M1069 526H592" class="arr green"/><text x="760" y="517" class="sm">sandboxId + 文件/命令客户端</text>
  <rect x="531" y="545" width="122" height="54" rx="8" fill="#ecfdf5" stroke="#34d399"/><text x="543" y="566" class="n">7. 保存绑定</text><text x="543" y="585" class="sm">lease=active</text>
  <path d="M592 620H1069" class="arr blue"/><text x="646" y="611" class="n">8. ensure cwd · Skill 版本变化时分片批量导入</text>
  <path d="M361 656H1069" class="arr blue"/><text x="568" y="647" class="n">9. Codex 调文件/Shell MCP → 远程执行</text>
  <path d="M1069 682H361" class="arr green"/><text x="613" y="673" class="sm">命令结果 / 文件内容（结构保持）</text>
  <path d="M361 718H592" class="arr"/><text x="410" y="709" class="n">10. finally: release()</text>
  <rect x="531" y="735" width="122" height="42" rx="8" fill="#fff7ed" stroke="#fb923c"/><text x="543" y="760" class="n">lease=idle</text>
  <rect x="55" y="735" width="380" height="42" rx="9" fill="#fef2f2" stroke="#fca5a5"/><text x="72" y="753" class="n">失败策略：获取超时 + WORKDIR → 工具本地回退</text><text x="72" y="770" class="sm">其它错误返回工具诊断；前置操作失败返回 503</text>
  <text x="44" y="804" class="sm">沙箱按需创建且不是每轮销毁：同一会话后续工具调用复用，短时间内不重复健康检查和续期。</text>
</svg>
