<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">AgentCore Runloop 与 Agent Sandbox 总体架构</title>
  <desc id="desc">展示调用方、Harness、Runloop、会话沙箱、AgentCore 资源与持久存储之间的边界和数据流。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".1"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#475569"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.h1{font-size:28px;font-weight:800;fill:#0f172a}.sub{font-size:14px;fill:#64748b}.layer{font-size:15px;font-weight:800;fill:#334155}.title{font-size:15px;font-weight:750;fill:#0f172a}.body{font-size:12px;fill:#475569}.small{font-size:11px;fill:#64748b}.edge{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.blue{fill:none;stroke:#2563eb;stroke-width:2.2;marker-end:url(#blueArrow)}.dash{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1280" height="860" fill="url(#bg)"/>
  <text x="48" y="48" class="h1">Agent Sandbox 技术架构</text>
  <text x="48" y="74" class="sub">Codex 与编排留在 Harness · 文件和 Shell 进入会话沙箱 · 一会话一沙箱</text>

  <rect x="48" y="102" width="1184" height="82" rx="16" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="72" y="128" class="layer">入口与身份上下文</text>
  <rect x="72" y="140" width="260" height="28" rx="7" fill="#eff6ff" stroke="#93c5fd"/><text x="86" y="159" class="body">Chat / AG-UI / API Caller</text>
  <rect x="356" y="140" width="330" height="28" rx="7" fill="#eff6ff" stroke="#93c5fd"/><text x="370" y="159" class="body">Agent API：已有访问校验；Body 提供 uid</text>
  <rect x="710" y="140" width="474" height="28" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="724" y="159" class="body">绑定键 = uid + conversationId　·　请求不允许覆盖部署配置</text>

  <path d="M640 184V215" class="blue"/>

  <rect x="48" y="218" width="760" height="400" rx="18" fill="#fff" stroke="#a5b4fc" filter="url(#shadow)"/>
  <text x="72" y="248" class="layer">AgentCore Runloop Harness · Node 22 · :8080</text>
  <rect x="72" y="268" width="212" height="88" rx="12" fill="#eef2ff" stroke="#818cf8"/>
  <text x="88" y="292" class="title">HTTP / AG-UI 边界</text><text x="88" y="315" class="body">校验 uid / conversationId</text><text x="88" y="335" class="body">附件引用、请求互斥、SSE</text>
  <rect x="300" y="268" width="220" height="88" rx="12" fill="#ecfeff" stroke="#22d3ee"/>
  <text x="316" y="292" class="title">SandboxManager</text><text x="316" y="315" class="body">绑定、健康检查、续期</text><text x="316" y="335" class="body">同会话复用 / 并发拒绝</text>
  <rect x="536" y="268" width="244" height="88" rx="12" fill="#ecfdf5" stroke="#34d399"/>
  <text x="552" y="292" class="title">AgentCore Runtime</text><text x="552" y="315" class="body">Model / MCP / Skill</text><text x="552" y="335" class="body">credentials.get(凭证资源名)</text>

  <rect x="72" y="382" width="708" height="94" rx="12" fill="#fff7ed" stroke="#fb923c"/>
  <text x="88" y="407" class="title">Runloop + Codex（本地执行引擎）</text>
  <text x="88" y="431" class="body">Codex 通过 loopback 调用模型与 MCP；系统提示词中的 cwd 指向沙箱内会话根</text>
  <text x="88" y="453" class="body">文件 / Shell 工具绑定 AgentSandboxExecBackend；Codex 本身不进入沙箱</text>

  <rect x="72" y="502" width="220" height="88" rx="12" fill="#fefce8" stroke="#eab308"/>
  <text x="88" y="527" class="title">附件物化</text><text x="88" y="550" class="body">校验归属 / ETag / 大小</text><text x="88" y="570" class="body">流式写入 uploads/</text>
  <rect x="308" y="502" width="220" height="88" rx="12" fill="#fefce8" stroke="#eab308"/>
  <text x="324" y="527" class="title">Skill Bundle 导入</text><text x="324" y="550" class="body">SDK 持久根 → 批量写会话沙箱</text><text x="324" y="570" class="body">版本目录 · ready 摘要标记</text>
  <rect x="544" y="502" width="236" height="88" rx="12" fill="#fefce8" stroke="#eab308"/>
  <text x="560" y="527" class="title">产物发布</text><text x="560" y="550" class="body">沙箱读取常规文件字节</text><text x="560" y="570" class="body">publish_artifact → /f/&lt;id&gt;</text>

  <rect x="840" y="218" width="392" height="400" rx="18" fill="#0f172a" stroke="#1e293b" filter="url(#shadow)"/>
  <text x="866" y="248" font-size="15" font-weight="800" fill="#e2e8f0">阿里云 Agent Sandbox · cn-hangzhou</text>
  <rect x="866" y="270" width="340" height="74" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="884" y="295" font-size="15" font-weight="750" fill="#fff">Session Sandbox A</text><text x="884" y="318" font-size="12" fill="#cbd5e1">uid-A + conversation-1</text><text x="884" y="334" font-size="11" fill="#94a3b8">代码 · uploads · Skills · 命令进程</text>
  <rect x="866" y="360" width="340" height="74" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="884" y="385" font-size="15" font-weight="750" fill="#fff">Session Sandbox B</text><text x="884" y="408" font-size="12" fill="#cbd5e1">uid-A + conversation-2</text><text x="884" y="424" font-size="11" fill="#94a3b8">独立文件系统 · 可并行执行</text>
  <rect x="866" y="450" width="340" height="74" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="884" y="475" font-size="15" font-weight="750" fill="#fff">Session Sandbox C</text><text x="884" y="498" font-size="12" fill="#cbd5e1">uid-B + conversation-1</text><text x="884" y="514" font-size="11" fill="#94a3b8">租户与会话双重隔离</text>
  <rect x="866" y="542" width="340" height="50" rx="10" fill="#172554" stroke="#3b82f6"/>
  <text x="884" y="564" font-size="12" font-weight="700" fill="#dbeafe">模板：code-interpreter-v1</text><text x="884" y="582" font-size="11" fill="#93c5fd">Shell / Node / Git / Python · 不要求 Codex</text>

  <path d="M520 312H840" class="blue"/><text x="644" y="302" class="small">create / connect / health / renew</text>
  <path d="M780 430H840" class="edge"/><text x="786" y="419" class="small">文件与 Shell</text>

  <rect x="48" y="650" width="1184" height="150" rx="18" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="72" y="680" class="layer">外部持久化与控制面</text>
  <rect x="72" y="700" width="260" height="72" rx="12" fill="#ecfdf5" stroke="#34d399"/><text x="88" y="725" class="title">AgentCore Credentials</text><text x="88" y="748" class="body">工作负载身份动态获取 Key</text><text x="88" y="765" class="small">环境仅保存凭证资源名</text>
  <rect x="356" y="700" width="260" height="72" rx="12" fill="#f0fdf4" stroke="#4ade80"/><text x="372" y="725" class="title">NAS（可选工作根）</text><text x="372" y="748" class="body">跨沙箱保存代码与中间数据</text><text x="372" y="765" class="small">按租户 / 会话子目录隔离</text>
  <rect x="640" y="700" width="260" height="72" rx="12" fill="#fff7ed" stroke="#fb923c"/><text x="656" y="725" class="title">OSS Artifact Root</text><text x="656" y="748" class="body">最终交付物与 .files.json</text><text x="656" y="765" class="small">不暴露绝对存储路径</text>
  <rect x="924" y="700" width="260" height="72" rx="12" fill="#f8fafc" stroke="#94a3b8"/><text x="940" y="725" class="title">共享绑定存储（下一阶段）</text><text x="940" y="748" class="body">CAS / TTL / sandboxId / lease</text><text x="940" y="765" class="small">支持多副本与故障恢复</text>

  <path d="M658 356V700" class="edge dash"/><path d="M1036 618V700" class="edge dash"/><path d="M662 590V700" class="edge dash"/>
  <text x="48" y="834" class="small">安全原则：超时整请求回退 · 不混用文件系统 · 不记录凭证/SDK 正文 · 路径限制在会话根 · 默认关闭公网</text>
</svg>
