<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Agent Sandbox 数据流与安全边界</title><desc id="desc">描述凭证、身份、附件、Skill、工作文件与最终产物如何跨越 Harness 和沙箱边界。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#475569"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.h{font-size:27px;font-weight:800;fill:#0f172a}.sub{font-size:14px;fill:#64748b}.t{font-size:15px;font-weight:750;fill:#0f172a}.b{font-size:12px;fill:#475569}.s{font-size:11px;fill:#64748b}.e{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:6 5}</style></defs>
  <rect width="1280" height="820" fill="#f8fafc"/><text x="44" y="48" class="h">数据流与安全边界</text><text x="44" y="74" class="sub">身份不来自模型 · Key 不进入环境 · 路径不越过会话根 · 最终产物走受控发布</text>
  <rect x="44" y="102" width="350" height="650" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="68" y="134" class="t">Agent API / Harness</text>
  <rect x="68" y="158" width="302" height="82" rx="12" fill="#eff6ff" stroke="#60a5fa"/><text x="84" y="183" class="t">请求上下文</text><text x="84" y="205" class="b">Body uid + conversationId</text><text x="84" y="224" class="s">接入方鉴权；工具参数不得覆盖</text>
  <rect x="68" y="264" width="302" height="82" rx="12" fill="#ecfdf5" stroke="#34d399"/><text x="84" y="289" class="t">凭证解析</text><text x="84" y="311" class="b">credentials.get(resourceName)</text><text x="84" y="330" class="s">Key 仅进入 SDK 调用内存</text>
  <rect x="68" y="370" width="302" height="112" rx="12" fill="#fefce8" stroke="#eab308"/><text x="84" y="395" class="t">输入校验</text><text x="84" y="418" class="b">附件归属 / ETag / 大小 / HTTPS 主机</text><text x="84" y="440" class="b">Skill 根与符号链接边界</text><text x="84" y="462" class="s">失败只影响当前请求</text>
  <rect x="68" y="506" width="302" height="112" rx="12" fill="#fff7ed" stroke="#fb923c"/><text x="84" y="531" class="t">输出治理</text><text x="84" y="554" class="b">publish_artifact 固定当前 uid/会话</text><text x="84" y="576" class="b">拒绝穿越、符号链接、覆盖</text><text x="84" y="598" class="s">只返回 /f/&lt;file-id&gt;</text>
  <rect x="68" y="642" width="302" height="82" rx="12" fill="#fef2f2" stroke="#f87171"/><text x="84" y="667" class="t">禁止泄露</text><text x="84" y="689" class="b">Token / SDK message / 响应正文</text><text x="84" y="708" class="s">日志仅保留阶段、code、status、requestId</text>

  <rect x="430" y="102" width="420" height="650" rx="18" fill="#0f172a" stroke="#1e293b"/><text x="454" y="134" font-size="15" font-weight="750" fill="#e2e8f0">会话沙箱：uid + conversationId</text>
  <rect x="454" y="158" width="372" height="70" rx="12" fill="#1e293b" stroke="#475569"/><text x="472" y="184" font-size="15" font-weight="750" fill="#fff">AGENTCORE_SANDBOX_ROOT</text><text x="472" y="207" font-size="12" fill="#cbd5e1">所有相对路径解析到该根，越界直接拒绝</text>
  <rect x="454" y="252" width="176" height="110" rx="12" fill="#172554" stroke="#3b82f6"/><text x="470" y="278" font-size="14" font-weight="700" fill="#dbeafe">uploads/</text><text x="470" y="301" font-size="12" fill="#bfdbfe">已确认附件</text><text x="470" y="322" font-size="11" fill="#93c5fd">短票据不进入模型</text><text x="470" y="342" font-size="11" fill="#93c5fd">常规文件，无链接</text>
  <rect x="650" y="252" width="176" height="110" rx="12" fill="#164e63" stroke="#22d3ee"/><text x="666" y="278" font-size="14" font-weight="700" fill="#cffafe">.agents/skills/</text><text x="666" y="301" font-size="12" fill="#a5f3fc">会话内 Skill 副本</text><text x="666" y="322" font-size="11" fill="#67e8f9">源来自 SDK 持久根</text><text x="666" y="342" font-size="11" fill="#67e8f9">脚本相对路径可用</text>
  <rect x="454" y="386" width="372" height="122" rx="12" fill="#1e293b" stroke="#64748b"/><text x="472" y="412" font-size="14" font-weight="700" fill="#fff">业务代码与中间文件</text><text x="472" y="436" font-size="12" fill="#cbd5e1">clone / generate / edit / build / test</text><text x="472" y="458" font-size="12" fill="#cbd5e1">Shell 进程、Node、Git、Python</text><text x="472" y="482" font-size="11" fill="#94a3b8">默认公网关闭；按任务显式开放</text>
  <rect x="454" y="532" width="372" height="92" rx="12" fill="#3f3f46" stroke="#a1a1aa"/><text x="472" y="558" font-size="14" font-weight="700" fill="#fff">待发布文件</text><text x="472" y="582" font-size="12" fill="#e4e4e7">Harness 读取字节，不暴露沙箱内部绝对路径</text><text x="472" y="604" font-size="11" fill="#a1a1aa">仅常规文件 · 校验父目录与符号链接</text>
  <rect x="454" y="648" width="372" height="76" rx="12" fill="#052e16" stroke="#22c55e"/><text x="472" y="674" font-size="14" font-weight="700" fill="#dcfce7">可选 NAS 挂载</text><text x="472" y="697" font-size="12" fill="#bbf7d0">需要跨沙箱保存代码时，挂到独立工作根</text><text x="472" y="715" font-size="11" fill="#86efac">按 uid / conversationId 子目录收窄权限</text>

  <rect x="886" y="102" width="350" height="650" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="910" y="134" class="t">外部资源</text>
  <rect x="910" y="158" width="302" height="92" rx="12" fill="#ecfdf5" stroke="#34d399"/><text x="926" y="184" class="t">AgentCore Credentials</text><text x="926" y="207" class="b">Sandbox API Key</text><text x="926" y="229" class="s">工作负载身份鉴权，不下发给模型</text>
  <rect x="910" y="284" width="302" height="100" rx="12" fill="#eef2ff" stroke="#818cf8"/><text x="926" y="310" class="t">AgentCore Skill Workspace</text><text x="926" y="333" class="b">workspaceId/name/version</text><text x="926" y="355" class="s">共享持久缓存，不按 uid 分区</text><text x="926" y="374" class="s">Harness 校验后分片批量导入沙箱</text>
  <rect x="910" y="418" width="302" height="100" rx="12" fill="#eff6ff" stroke="#60a5fa"/><text x="926" y="444" class="t">私有 OSS 输入</text><text x="926" y="467" class="b">单对象 10 分钟读取票据</text><text x="926" y="489" class="s">校验后物化，票据随即丢弃</text>
  <rect x="910" y="552" width="302" height="112" rx="12" fill="#fff7ed" stroke="#fb923c"/><text x="926" y="578" class="t">OSS Artifact Root</text><text x="926" y="601" class="b">&lt;root&gt;/&lt;uid&gt;/&lt;conversationId&gt;</text><text x="926" y="623" class="b">文件 + .files.json 映射</text><text x="926" y="645" class="s">显式冲突拒绝；自动名称安全递增</text>
  <rect x="910" y="696" width="302" height="28" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/><text x="926" y="715" class="s">AgentLoop：只接收脱敏遥测与耗时</text>

  <path d="M370 305H910" class="e dash"/><text x="584" y="295" class="s">凭证值只到 SDK，不写入沙箱</text>
  <path d="M910 468H826" class="e"/><path d="M910 334H826" class="e"/><path d="M826 578H910" class="e"/>
  <text x="44" y="794" class="s">持久根不与沙箱目录“重复”：NAS 是可选的沙箱内挂载；OSS Artifact Root 位于 Harness 交付侧，两者职责不同。</text>
</svg>
